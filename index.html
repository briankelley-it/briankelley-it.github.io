<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Brian Kelley · SQL &amp; Python Developer</title>
    <meta name="description" content="Brian Kelley is a self-taught SQL and Python developer. Projects, a live-looking SQL demo, and how to get in touch." />
    <meta name="theme-color" content="#f2f2f3" />
    <link rel="icon" type="image/svg+xml" href="./favicon.svg" />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Barlow+Condensed:wght@600&family=Barlow:wght@400;500&family=IBM+Plex+Mono:wght@400;500&display=swap" />
    <script>
      // Runs before first paint: pick the theme and hide reveal targets, so there is no flash.
      (function () {
        var d = document.documentElement, t;
        try { t = localStorage.getItem('bk-portfolio-theme'); } catch (e) {}
        if (t !== 'light' && t !== 'dark') {
          t = window.matchMedia && matchMedia('(prefers-color-scheme: dark)').matches ? 'dark' : 'light';
        }
        d.setAttribute('data-theme', t);
        d.classList.add('js');
      })();
    </script>
  </head>
  <body>
    <div id="root"></div>
    <noscript>This portfolio needs JavaScript to run. You can still reach Brian at brian.kelley@email.com.</noscript>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
